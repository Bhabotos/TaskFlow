name: Deploy

# Manual only for the first production deployment (Actions tab -> Deploy -> Run workflow).
# To deploy automatically on every merge later, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS

# Never run two deployments at once; never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ECR_REGISTRY: 790076599312.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskflow
  EC2_INSTANCE_ID: i-0b6e548ca3124bf55
  DEPLOY_DIR: /opt/taskflow

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  deploy:
    name: Build, push and deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Check whether image tag already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG already in ECR - skipping build (re-run)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check instance is reachable by SSM
        run: |
          status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)"
          if [ "$status" != "Online" ]; then
            echo "::error::EC2 instance $EC2_INSTANCE_ID is not Online in SSM (status: $status). Check the SSM agent and instance profile."
            exit 1
          fi

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail
          b64() { base64 -w0 "$1"; }
          remote="$(cat <<EOF
          set -eu
          mkdir -p $DEPLOY_DIR/nginx
          echo '$(b64 deploy/docker-compose.prod.yml)' | base64 -d > $DEPLOY_DIR/docker-compose.yml
          echo '$(b64 nginx/default.conf)' | base64 -d > $DEPLOY_DIR/nginx/default.conf
          echo '$(b64 scripts/deploy-ec2.sh)' | base64 -d > $DEPLOY_DIR/deploy-ec2.sh
          TASKFLOW_IMAGE='$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG' ECR_REGISTRY='$ECR_REGISTRY' AWS_REGION='$AWS_REGION' bash $DEPLOY_DIR/deploy-ec2.sh
          EOF
          )"
          jq -n --arg c "$remote" '{commands: [$c], executionTimeout: ["900"]}' > params.json

          # SendCommand requests are limited to ~97 KB; fail early with a clear message.
          size="$(wc -c < params.json)"
          echo "SSM payload: $size bytes"
          if [ "$size" -gt 90000 ]; then
            echo "::error::SSM payload ($size bytes) is near the 97 KB SendCommand limit. Fetch files from S3 instead of inlining them."
            exit 1
          fi

          cmd_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TaskFlow deploy ${IMAGE_TAG:0:12}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $cmd_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
          done

          echo "::group::Remote stdout"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          echo "::group::Remote stderr"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "::endgroup::"

          case "$status" in
            Pending|InProgress|Delayed)
              echo "::error::Timed out waiting for SSM command $cmd_id (last status: $status). It may still be running on the instance; check it in the SSM console."
              exit 1 ;;
          esac
          if [ "$status" != "Success" ]; then
            echo "::error::Deployment of ${IMAGE_TAG:0:12} failed (SSM status: $status). See remote stderr above; the script rolls back to the previous image when possible."
            exit 1
          fi
          echo "Deployed ${IMAGE_TAG:0:12} to $EC2_INSTANCE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
