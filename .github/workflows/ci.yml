name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t mini-task-manager:ci .
      - name: Smoke test container
        run: |
          docker run -d --name tm -p 5000:5000 mini-task-manager:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5000/api/health && exit 0
            sleep 1
          done
          docker logs tm
          exit 1

  report:
    name: CI result
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "test: ${{ needs.test.result }}, docker: ${{ needs.docker.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::CI failed"; exit 1
          fi
          echo "CI passed"
