services:
  web:
    build: .
    image: mini-task-manager:latest
    container_name: mini-task-manager
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
      TZ: ${TZ:-UTC}
    volumes:
      - task_data:/data
    ports:
      # Published on loopback only; use the "proxy" profile (Nginx) for public access.
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional reverse proxy: docker compose --profile proxy up -d --build
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m

volumes:
  task_data:
